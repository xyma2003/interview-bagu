name: 内容纠错
description: 反馈题目代码、知识表述、来源或排版问题。
title: "[纠错] "
body:
  - type: markdown
    attributes:
      value: |
        欢迎指出具体问题。可先查看[来源与核验规范](https://github.com/xyma2003/interview-bagu/blob/main/SOURCE_AUDIT.md)和[示例验证范围](https://github.com/xyma2003/interview-bagu/blob/main/EXAMPLE_CHECKS.md)。
        知识、来源或排版问题不必填写代码复现；请不要提交个人信息、密钥或未经脱敏的日志。
  - type: dropdown
    id: category
    attributes:
      label: 问题类型
      description: 可多选；不确定时可以留空。
      multiple: true
      options:
        - 代码实现或边界条件
        - 知识表述或版本适用范围
        - 技术参考或面经来源
        - 排版、链接或导航
        - 其他
    validations:
      required: false
  - type: textarea
    id: location
    attributes:
      label: 题目定位
      description: 提供题目链接，或文件路径与本库 Q 题号。手册、导航等没有 Q 题号时请写章节；本库 Q 题号与 LeetCode 题号不同。
      placeholder: |
        文件：frontend/frontend_bigco.md
        本库题号：Q37
        链接：https://github.com/xyma2003/interview-bagu/blob/main/frontend/frontend_bigco.md#q37
        具体段落或代码：
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 实际问题
      description: 指出原文或代码的具体问题，以及出现的条件；可以引用短句、错误结果或描述页面显示。
      placeholder: 哪段内容在什么条件下不正确？目前发生了什么？
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望与依据
      description: 说明预期结果或建议表述。技术问题尽量提供适用版本及官方规范、文档或原论文的直接链接；暂缺依据可明确写“待核对”。排版问题描述期望的显示即可。
      placeholder: |
        预期结果或建议修改：
        适用版本或输入前提：
        参考链接与对应章节／推导依据：
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境或文档版本（如适用）
      description: 代码问题请填写实际语言、运行时和相关依赖版本；页面问题可写浏览器。概念或来源问题可仅补文档版本，也可以留空。
      placeholder: 操作系统、Node.js / Python / 浏览器版本、相关依赖版本，或所参考的规范版本。
    validations:
      required: false
  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现（如适用）
      description: 代码问题请提供可复制的输入、执行命令和实际输出；页面问题可写操作步骤。概念或来源问题没有执行过程时留空，不需要编造代码或运行结果。
      placeholder: |
        最小输入或操作步骤：
        执行命令（注明执行目录）：
        实际输出或错误：
        预期输出：
    validations:
      required: false
